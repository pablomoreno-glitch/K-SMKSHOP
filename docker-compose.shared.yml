# Run on a server that already has a Caddy in front (the laVillaSB VPS).
#
# That Caddy joins nothing of ours: instead our gateway joins its Docker network,
# so its Caddyfile can proxy api.ksmkshop.com to vape_gateway:8110.
# The storefront is normally served by Netlify, so the frontend container only
# starts with the "vps-storefront" profile; it then joins the same network and
# Caddy serves ksmkshop.com from vape_frontend:80.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.shared.yml up -d --build
#   docker compose ... --profile vps-storefront up -d --build frontend

services:
  gateway:
    networks: [vape, edge]
    # The gateway also sits on laVillaSB's network, where short names such as
    # "postgres" or "catalog" belong to laVillaSB's own containers. Use our
    # unique container names so it can only ever reach la tienda de vapers.
    environment:
      DB_HOST: vape_postgres
      SERVICE_BUSINESS_URL: http://vape_business:9201
      SERVICE_CATALOG_URL: http://vape_catalog:9202
      SERVICE_INVENTORY_URL: http://vape_inventory:9203
      SERVICE_ORDERS_URL: http://vape_orders:9204
      SERVICE_NOTIFICATIONS_URL: http://vape_notifications:9206

  frontend:
    profiles: ["vps-storefront"]
    networks: [vape, edge]
    # Caddy reaches it over the shared network; no host port is needed.
    ports: !reset []

networks:
  edge:
    name: ${EDGE_NETWORK:-lavillasb_lavilla}
    external: true
